version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - NODE_OPTIONS="--max-old-space-size=6144 --dns-result-order=ipv4first" npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - NODE_OPTIONS="--max-old-space-size=6144 --dns-result-order=ipv4first" NEXT_DISABLE_SWC_WORKER=1 npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*